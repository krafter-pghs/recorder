<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorder</title>
<style>
  :root { --red:#b3121b; --ok:#137333; --line:#e2e2e2; --mute:#5f6368; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f6f6f4; color:#141414; }
  header { background:#111; color:#fff; padding:12px 20px; font-weight:650; }
  main { max-width:560px; margin:20px auto; padding:0 16px; display:grid; gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { font-size:16px; margin:0 0 8px; }
  .muted { color:var(--mute); font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { font-size:16px; padding:10px 16px; border-radius:7px; border:0; background:var(--red); color:#fff; font-weight:600; cursor:pointer; }
  button.ok { background:var(--ok); }
  button:disabled { background:#bdbdbd; cursor:default; }
  select { font-size:15px; padding:7px; border-radius:6px; border:1px solid #ccc; }
  .dot { width:16px; height:16px; border-radius:50%; background:#ddd; }
  .dot.on { background:var(--red); } .dot.acc { background:#111; }
  .timer { font-weight:650; font-variant-numeric:tabular-nums; }
  .take { display:flex; gap:10px; align-items:center; padding:6px 8px; border:1px solid var(--line); border-radius:8px; margin-top:6px; }
  .take.sel { border-color:var(--red); background:#fbe9ea; }
  audio { height:34px; max-width:240px; }
  .msg { padding:10px 12px; border-radius:8px; font-size:14px; }
  .bad { background:#fbe9ea; color:#7a0c12; }
  .good { background:#e6f4ea; color:#0d4f22; }
  .info { background:#eef3fb; color:#1a3d73; }
</style>
</head>
<body>
<header>Recorder</header>
<main>
  <div class="card">
    <h2 id="label">Recording</h2>
    <div class="muted" id="mode"></div>
  </div>

  <div class="card">
    <div class="row" id="freeTempo">
      <label>Tempo <select id="bpm"></select></label>
      <label><input type="checkbox" id="metroOn" checked> Metronome</label>
    </div>
    <div class="row" id="lockedTempo" style="display:none"><b id="lockedText"></b></div>
    <div class="row" id="clickRow" style="margin-top:8px"><label><input type="checkbox" id="clickOn" checked> Click audible (turn off if you're using headphones)</label></div>
    <div class="row" style="margin-top:14px">
      <button id="recBtn">● Record</button>
      <div class="dot" id="dot"></div>
      <span class="timer" id="timer">0:00</span>
    </div>
    <div class="muted" style="margin-top:8px">With a metronome, the first 4 clicks are your count-in. Record as many takes as you like, listen back, then send your best one.</div>
    <div id="err" style="margin-top:10px"></div>
    <div id="takes"></div>
  </div>

  <div class="card" id="sendCard" style="display:none">
    <label class="row"><input type="checkbox" id="listened"> I listened to this take and it's the one I want graded.</label>
    <div class="row" style="margin-top:10px"><button class="ok" id="sendBtn" disabled>Send take</button></div>
    <div id="sendMsg" style="margin-top:10px"></div>
  </div>
</main>

<script>
const P = new URLSearchParams(location.search);
const TOKEN = P.get("t"), UPLOAD = P.get("u");
const LIVE = !!(TOKEN && UPLOAD);
const $ = id => document.getElementById(id);

// Setup
for (let t = 120; t <= 255; t += 15) $("bpm").add(new Option(t + " bpm", t));
const LOCK = P.get("lock") === "1";
const LOCK_BPM = Number(P.get("bpm")) || 0;
if (P.get("bpm") && !LOCK) $("bpm").value = P.get("bpm");
if (P.get("metro") === "0") $("metroOn").checked = false;
if (LOCK) {
  $("freeTempo").style.display = "none";
  $("lockedTempo").style.display = "flex";
  if (P.get("metro") === "1" && LOCK_BPM) {
    $("lockedText").textContent = "Tempo: " + LOCK_BPM + " bpm (set in the app)";
  } else {
    $("lockedText").textContent = "No metronome for this recording.";
    $("clickRow").style.display = "none"; $("dot").style.display = "none";
  }
}
function curBpm(){ return LOCK ? LOCK_BPM : +$("bpm").value; }
if (P.get("label")) $("label").textContent = P.get("label");
$("mode").textContent = LIVE
  ? "When you send a take, it goes to your teacher. You can close this tab after it says Sent."
  : "Test mode: opened directly, so nothing will be sent. Recordings stay on this device.";

// Metronome (Web Audio lookahead scheduler)
let ctx = null, timer = null, nextT = 0, beat = 0;
function click(t, acc) {
  if ($("clickOn").checked) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = acc ? 1600 : 1000;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.06);
  }
  setTimeout(() => { $("dot").className = "dot " + (acc ? "acc" : "on"); setTimeout(() => $("dot").className = "dot", 90); }, Math.max(0, (t - ctx.currentTime) * 1000));
}
function metroStart(bpm) {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  beat = 0; nextT = ctx.currentTime + 0.12;
  timer = setInterval(() => { while (nextT < ctx.currentTime + 0.12) { click(nextT, beat % 4 === 0); nextT += 60 / bpm; beat++; } }, 25);
}
function metroStop() { clearInterval(timer); timer = null; }

// Recording
let stream = null, rec = null, chunks = [], t0 = 0, tick = null;
const takes = []; let sel = -1;
function showErr(m) { $("err").innerHTML = m ? `<div class="msg bad">${m}</div>` : ""; }

async function start() {
  showErr("");
  if (!navigator.mediaDevices || !window.MediaRecorder) { showErr("This browser can't record audio. Use Chrome."); return; }
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    showErr(`Microphone blocked (${e.name}). Click the mic icon in the address bar, set Microphone to Allow, then reload this page.`);
    return;
  }
  if ($("metroOn").checked && curBpm()) metroStart(curBpm());
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    metroStop(); clearInterval(tick);
    const blob = new Blob(chunks, { type: rec.mimeType });
    takes.push({ blob, url: URL.createObjectURL(blob), secs: Math.round((Date.now() - t0) / 1000) });
    sel = takes.length - 1; rec = null;
    $("recBtn").textContent = "● Record";
    drawTakes();
  };
  rec.start(); t0 = Date.now();
  $("recBtn").textContent = "■ Stop";
  tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 250);
}
$("recBtn").onclick = () => rec ? rec.stop() : start();

function drawTakes() {
  $("takes").innerHTML = takes.map((t, i) => `<div class="take ${i === sel ? "sel" : ""}">
    <input type="radio" name="tk" ${i === sel ? "checked" : ""} data-i="${i}"> Take ${i + 1} · ${t.secs}s <audio controls src="${t.url}"></audio></div>`).join("");
  document.querySelectorAll('input[name=tk]').forEach(r => r.onchange = () => { sel = +r.dataset.i; $("listened").checked = false; drawTakes(); });
  $("sendCard").style.display = (LIVE && takes.length) ? "block" : "none";
  $("sendBtn").textContent = `Send take ${sel + 1}`;
  $("sendBtn").disabled = !$("listened").checked;
}
$("listened").onchange = () => { $("sendBtn").disabled = !$("listened").checked; };

// Send to the teacher's Apps Script
$("sendBtn").onclick = async () => {
  const t = takes[sel]; if (!t) return;
  $("sendBtn").disabled = true; $("recBtn").disabled = true;
  $("sendMsg").innerHTML = `<div class="msg info">Sending… don't close this tab.</div>`;
  try {
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(t.blob); });
    const payload = JSON.stringify({ t: TOKEN, mime: t.blob.type, secs: t.secs, bpm: curBpm(), metro: $("metroOn").checked, data: b64 });
    let out = null;
    try {
      const resp = await fetch(UPLOAD, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: payload });
      out = await resp.json();
    } catch (netErr) {
      // Chrome couldn't read Google's reply. Send again without reading the reply;
      // the app tab confirms whether it was saved.
      await fetch(UPLOAD, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: payload });
      $("sendMsg").innerHTML = `<div class="msg info"><b>Sent, but not confirmed here.</b> Go back to the app tab: if it says <b>Saved</b> within 10 seconds, you're done. If it keeps saying "Waiting," tell your teacher.</div>`;
      return;
    }
    if (!out.ok) throw new Error(out.error || "Upload refused");
    $("sendMsg").innerHTML = `<div class="msg good"><b>Sent.</b> Your teacher has it. You can close this tab and go back to the app.</div>`;
  } catch (e) {
    $("sendMsg").innerHTML = `<div class="msg bad">Didn't send: ${String(e.message || e)}. Your takes are still here. Try again, or tell your teacher.</div>`;
    $("sendBtn").disabled = false; $("recBtn").disabled = false;
  }
};
</script>
</body>
</html>
